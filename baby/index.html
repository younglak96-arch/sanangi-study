<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>임신·출산 준비 트래커</title>
<meta name="description" content="임신 주차별 아기 발달, 금천구·서울·정부 지원금과 출산박스, 산전 검진 타임라인, 음식 검색과 출산가방 체크리스트를 한 곳에서.">
<meta name="theme-color" content="#fdf8f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="임신트래커">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23fdeaf1'/><text x='50' y='72' font-size='58' text-anchor='middle'>🤰</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23fdeaf1'/><text x='50' y='72' font-size='58' text-anchor='middle'>🤰</text></svg>">
<style>:root{
  --pink:#e2587f; --pink-d:#c84068; --pink-l:#fdeaf1; --pink-m:#f8b9cc;
  --ink:#2b2024; --sub:#8a767c; --line:#f2e4e8; --bg:#fdf8f8;
  --ok:#16795a; --ok-bg:#e8f6ef; --warn:#94620a; --warn-bg:#fdf3dc; --bad:#b3363b; --bad-bg:#fdeced;
  --shadow:0 1px 6px rgba(90,60,70,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:16px}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--sub)}
.tiny{font-size:12px;line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ── 상단 헤더 ── */
#top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(253,248,248,.93);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
#top .ttl{flex:1;min-width:0}
#top .ttl b{display:block;font-size:17px;letter-spacing:-.4px;line-height:1.25}
#top .ttl span{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
#top .wkchip{
  flex:0 0 auto;background:var(--pink-l);color:var(--pink-d);font-weight:700;font-size:12.5px;
  padding:6px 11px;border-radius:99px;letter-spacing:-.2px;white-space:nowrap
}
#top .gear{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;background:#fff;border:1px solid var(--line)}

/* ── 공통 카드 ── */
.wrap{padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:var(--shadow)}
.card>h2{font-size:14.5px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.card>h2 .em{font-size:16px}
.card .lead{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.hr{height:1px;background:var(--line);margin:12px 0}

/* ── 히어로 ── */
.hero{
  position:relative;overflow:hidden;margin:14px 0 4px;padding:18px 16px 16px;border-radius:22px;
  background:linear-gradient(140deg,#ffe0ea 0%,#fff1f5 55%,#fff7ef 100%);
  border:1px solid #fbd7e2;box-shadow:0 6px 18px rgba(226,88,127,.10)
}
.hero .lbl{font-size:12px;font-weight:700;color:var(--pink-d);letter-spacing:-.2px}
.hero .big{font-size:36px;font-weight:850;letter-spacing:-1.6px;line-height:1.1;margin:2px 0 0}
.hero .big small{font-size:16px;font-weight:700;letter-spacing:-.4px;margin-left:2px}
.hero .sub2{font-size:12.5px;color:#8a6a74;margin-top:2px;letter-spacing:-.2px}
.hero .dday{
  position:absolute;right:14px;top:16px;text-align:center;background:rgba(255,255,255,.78);
  border:1px solid #f8cddb;border-radius:14px;padding:7px 11px;min-width:66px
}
.hero .dday b{display:block;font-size:19px;font-weight:850;color:var(--pink-d);letter-spacing:-.8px;line-height:1.15}
.hero .dday span{display:block;font-size:10px;color:#96707c;margin-top:1px}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .meta i{font-style:normal;font-size:11.5px;background:rgba(255,255,255,.8);border:1px solid #f9d5e0;color:#7c5a66;border-radius:9px;padding:3px 8px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.75);overflow:hidden;margin-top:12px;border:1px solid #f8d3df}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f79bb8,#e2587f);transition:width .3s}
.bar-txt{display:flex;justify-content:space-between;font-size:10.5px;color:#96707c;margin-top:4px}

/* ── 아기 발달 ── */
.baby{display:flex;gap:14px;align-items:center}
.baby .fruit{
  flex:0 0 auto;width:74px;height:74px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:36px;background:linear-gradient(140deg,#fff2f6,#ffe6ee);border:1px solid #fbd5e1
}
.baby .info{min-width:0;flex:1}
.baby .info .fn{font-size:19px;font-weight:800;letter-spacing:-.6px;line-height:1.2}
.baby .info .sz{font-size:12.5px;color:var(--sub);margin-top:2px}
.baby .info .ds{font-size:12.5px;color:#5c4b51;margin-top:6px;line-height:1.5}
.wknav{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.wknav .btn-s{flex:0 0 auto;width:38px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fdf6f8;font-size:14px;color:var(--pink-d);font-weight:700}
.wknav .btn-s:disabled{opacity:.35}
.wknav .mid{flex:1;text-align:center;font-size:12px;color:var(--sub)}
.wknav .mid b{color:var(--ink);font-size:13px}
.wknav .now{flex:0 0 auto;font-size:11.5px;color:var(--pink-d);border:1px solid #f6c9d8;background:#fff;border-radius:99px;padding:5px 10px;font-weight:700}
.inline .in.setnum{flex:0 0 66px;min-width:66px;text-align:center;padding-left:4px;padding-right:4px}
.mini{flex:0 0 auto;font-size:12.5px;font-weight:800;color:#fff;background:var(--pink);border-radius:11px;padding:0 14px;height:42px}
.strip button.sel{background:#fff0f5;border-color:var(--pink-m);color:var(--pink-d)}

/* 주차 선택 스트립 */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{
  flex:0 0 auto;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;
  font-size:12px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1
}
.strip button span{font-size:9px;font-weight:600;opacity:.75}
.strip button.cur{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 2px 8px rgba(226,88,127,.35)}
.strip button.cur span{opacity:.9}
.strip button.ok{background:#f3f0f8;border-color:#e6dff2}

/* ── 체크포인트 ── */
.cp{display:flex;gap:9px;padding:10px 0;border-top:1px solid var(--line)}
.cp:first-of-type{border-top:0;padding-top:2px}
.cp .who{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:8px;padding:3px 7px;height:fit-content}
.cp .who.m{background:var(--pink-l);color:var(--pink-d)}
.cp .who.f{background:#e7eefb;color:#3a5f9e}
.cp .tx{font-size:13px;line-height:1.45;color:#4b3c42;letter-spacing:-.1px}

/* ── 오늘 할 일 ── */
.todo{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px;background:#fffdfd;display:flex;gap:10px}
.todo:first-of-type{margin-top:0}
.todo .dot{flex:0 0 auto;width:8px;height:8px;border-radius:99px;margin-top:6px;background:var(--pink)}
.todo.urgent{background:#fff7f9;border-color:#f8ccd9}
.todo.urgent .dot{background:#e2587f;box-shadow:0 0 0 4px #fde3ec}
.todo.done{opacity:.55}
.todo.done .dot{background:#bbb}
.todo .t{font-size:13.5px;font-weight:750;letter-spacing:-.2px;line-height:1.4}
.todo .d{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.todo .go{flex:0 0 auto;align-self:center;font-size:11px;color:var(--pink-d);border:1px solid #f7c9d7;border-radius:99px;padding:5px 9px;background:#fff;font-weight:700;white-space:nowrap}

/* ── 탭 세그먼트 ── */
.seg{display:flex;gap:4px;background:#f6ebee;border-radius:13px;padding:4px;margin:14px 0 2px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:-.3px}
.seg button.on{background:#fff;color:var(--pink-d);box-shadow:0 1px 4px rgba(90,60,70,.10)}

/* ── 칩 ── */
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12.5px;font-weight:650;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 12px;letter-spacing:-.2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ── 리스트 아이템 ── */
.item{border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;background:#fff;box-shadow:var(--shadow)}
.item.done{border-color:#dfeee7;background:#fbfefc}
.item .hd{display:flex;gap:8px;align-items:flex-start}
.item .hd .tt{flex:1;min-width:0;font-size:14.5px;font-weight:800;letter-spacing:-.4px;line-height:1.35}
.item .amt{font-size:12.5px;font-weight:800;color:var(--pink-d);margin-top:4px}
.item .ds{font-size:12.5px;color:#544349;margin-top:7px;line-height:1.55;letter-spacing:-.1px}
.item .kv{display:flex;gap:7px;font-size:12px;margin-top:6px;line-height:1.5;color:#6b585f}
.item .kv b{flex:0 0 auto;color:#9a848b;font-weight:700;min-width:38px}
.item .tip{font-size:11.5px;background:#fdf6f8;border-radius:10px;padding:8px 10px;margin-top:8px;color:#7d6470;line-height:1.5}
.badge{flex:0 0 auto;font-size:10.5px;font-weight:800;border-radius:7px;padding:3px 7px;letter-spacing:-.2px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:#eef2fb;color:#45608f}
.b-gray{background:#f3f1f2;color:#8b7d82}
.b-hot{background:#fde8e3;color:#c0442b}

/* 체크박스 행 */
.cbrow{display:flex;align-items:center;gap:9px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);flex-wrap:wrap}
.cb{
  width:25px;height:25px;border-radius:9px;border:1.6px solid #e4ccd4;background:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.15s
}
.cb.on{background:var(--pink);border-color:var(--pink)}
.cbrow .lbl2{font-size:12.5px;font-weight:700;color:#6b585f}

/* 입력 */
.in{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:14px;background:#fcf8f9;color:var(--ink);outline:none;letter-spacing:-.2px}
.in:focus{border-color:var(--pink-m);background:#fff}
textarea.in{min-height:42px;resize:vertical;line-height:1.5}
.inline{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.inline .in{flex:1;min-width:130px}
.inline .dt{flex:0 0 auto;width:135px}
.lbl-s{font-size:11.5px;font-weight:700;color:#9a848b;margin-bottom:4px;display:block}

/* 진행률 */
.prow{display:flex;align-items:center;gap:9px;margin:9px 0 3px}
.prow .pn{flex:0 0 auto;font-size:12.5px;font-weight:750;min-width:66px;color:#5b4a50}
.prow .pb{flex:1;height:7px;border-radius:99px;background:#f3e7eb;overflow:hidden}
.prow .pb>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f7a3bd,#e2587f);transition:width .3s}
.prow .pc{flex:0 0 auto;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

/* 검진 타임라인 */
.item .when{font-size:11.5px;color:var(--pink-d);font-weight:700;margin-top:3px}
.item .why{font-size:12.5px;color:#544349;margin-top:6px;line-height:1.55}
.item .prep{font-size:11.5px;color:#7d6470;margin-top:7px;background:#fbf6f8;border-radius:10px;padding:8px 10px;line-height:1.5}
.item .ds.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:5px;font-size:11.5px;font-weight:800;color:var(--pink-d)}
.bagwrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:2px 13px;box-shadow:var(--shadow);margin:6px 0 14px}
.grp{display:flex;align-items:center;gap:8px;margin:18px 2px 6px}
.grp b{font-size:13.5px;letter-spacing:-.3px}
.grp span{font-size:11.5px;color:var(--sub)}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.ck{display:flex;gap:11px;padding:13px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck .body{flex:1;min-width:0}
.ck .name{font-size:14px;font-weight:800;letter-spacing:-.35px;line-height:1.35}
.ck .when{font-size:11.5px;color:var(--pink-d);font-weight:700;margin-top:2px}
.ck .why{font-size:12px;color:#5c4b51;margin-top:5px;line-height:1.5}
.ck .prep{font-size:11.5px;color:#7d6470;margin-top:5px;background:#fbf6f8;border-radius:9px;padding:7px 9px;line-height:1.5}
.ck.done .name{color:#8d7a80;text-decoration:line-through;text-decoration-color:#d8c3c9}
.ck .fields{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}

/* 음식 */
.food{border:1px solid var(--line);border-left-width:4px;border-radius:13px;padding:11px 12px;margin:8px 0;background:#fff}
.food.good{border-left-color:#39a97c}
.food.caution{border-left-color:#e0a72b}
.food.avoid{border-left-color:#dc5b5f}
.food .top{display:flex;gap:8px;align-items:center}
.food .nm{flex:1;min-width:0;font-size:14px;font-weight:800;letter-spacing:-.3px}
.food .rs{font-size:12px;color:#5c4b51;margin-top:5px;line-height:1.5}
.food .ct{font-size:10.5px;color:#a39097;margin-top:4px}
.empty{text-align:center;padding:26px 10px;color:var(--sub);font-size:13px}
.searchbox{position:relative;margin-top:12px}
.searchbox .in{padding-left:36px;height:44px;border-radius:13px}
.searchbox .ic{position:absolute;left:12px;top:12px;font-size:15px;opacity:.5}

/* 준비물 */
.bagadd{display:flex;gap:7px;margin-top:9px}
.bagadd select{flex:0 0 auto;width:104px;border:1px solid var(--line);border-radius:11px;padding:9px 8px;background:#fcf8f9;font-size:13px}
.bagadd .in{flex:1}
.bagadd button{flex:0 0 auto;padding:0 14px;border-radius:11px;background:var(--pink);color:#fff;font-weight:800;font-size:13px}
.bgit{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.bgit:first-child{border-top:0}
.bgit .tx{flex:1;font-size:13.5px;letter-spacing:-.2px;line-height:1.4}
.bgit.on .tx{color:#a08e94;text-decoration:line-through;text-decoration-color:#dcc8ce}
.bgit .del{flex:0 0 auto;font-size:15px;color:#c8b3b9;padding:2px 4px}

/* 설정 시트 */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,32,36,.34);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#modal.hide{display:none}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:16px;font-weight:850;letter-spacing:-.5px;margin-bottom:4px}
.sheet .row2{margin-top:13px}
.sheet .foot{display:flex;gap:8px;margin-top:18px}
.sheet .foot button{flex:1;height:46px;border-radius:14px;font-weight:800;font-size:14px}
.sheet .foot .pri{background:var(--pink);color:#fff}
.sheet .foot .sec{background:#f6ebee;color:#6b585f}
.sheet .foot .ghost{flex:0 0 92px;background:#fff;border:1px solid var(--line);color:#8a767c}
.grab{width:38px;height:4px;border-radius:99px;background:#e8dade;margin:-6px auto 10px}

/* 하단 탭 */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));
}
#tabs .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:#a08e94}
#tabs .tb .ic{font-size:19px;line-height:1.1;filter:grayscale(1) opacity(.65)}
#tabs .tb .lb{font-size:10.5px;font-weight:700;letter-spacing:-.3px}
#tabs .tb.on{color:var(--pink-d)}
#tabs .tb.on .ic{filter:none}
#tabs .tb.on .lb{font-weight:800}
.note{font-size:11.5px;color:#9a848b;line-height:1.5;padding:10px 4px 0}
.foot-note{text-align:center;font-size:11px;color:#b6a3a9;padding:14px 10px 6px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="ttl"><b>임신·출산 준비</b><span>금천구 · 우리 아기 트래커</span></div>
    <span class="wkchip" id="wkchip">8주 0일</span>
    <button class="gear" data-act="openSet" aria-label="설정">⚙️</button>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button class="tb on" data-act="tab" data-tab="home"><span class="ic">🏠</span><span class="lb">홈</span></button>
    <button class="tb" data-act="tab" data-tab="fund"><span class="ic">🎁</span><span class="lb">지원금·박스</span></button>
    <button class="tb" data-act="tab" data-tab="check"><span class="ic">🩺</span><span class="lb">검진</span></button>
    <button class="tb" data-act="tab" data-tab="food"><span class="ic">🍽️</span><span class="lb">음식·준비물</span></button>
  </nav>
</div>

<div id="modal" class="hide">
  <div class="sheet" role="dialog" aria-label="설정">
    <div class="grab"></div>
    <h3>설정</h3>
    <p class="tiny muted" id="setInfo">주차를 직접 바꿀 수 있어요.</p>

    <div class="row2">
      <span class="lbl-s">출산예정일로 맞추기</span>

      GROUPS.forEach(function (g) {
        var list = FUNDS.filter(function (f) { return f.g === g.k; });
        if (!list.length) return;
        h += '<div class="grp"><b>' + g.em + " " + g.k + "</b><span>" + list.length + "건</span></div>";
        list.forEach(function (f) {
          var rec = S.funds[f.id] || {}, bd = badgeFund(f, st);
          h += '<div class="item ' + (rec.done ? "done" : "") + '">' +
            '<div class="hd"><div class="tt">' + f.t + '<div class="amt">' + f.amt + "</div></div>" +
            '<span class="badge ' + bd[0] + '">' + bd[1] + "</span></div>" +
            '<div class="ds' + (f.d.length > 110 ? " clamp" : "") + '" id="ds_' + f.id + '">' + f.d + "</div>" +
            (f.d.length > 110 ? '<button class="more" data-act="more" data-id="' + f.id + '">더 보기 ▾</button>' : "") +
            '<div class="kv"><b>시기</b><span>' + f.when + "</span></div>" +
            '<div class="kv"><b>신청</b><span>' + f.where + "</span></div>" +
            '<div class="kv"><b>준비</b><span>' + f.need + "</span></div>" +
            (f.tip ? '<div class="tip">💡 ' + f.tip + "</div>" : "") +
            '<div class="cbrow"><button class="cb ' + (rec.done ? "on" : "") + '" data-act="fund" data-id="' + f.id + '">' + (rec.done ? "✓" : "") + "</button>" +
            '<span class="lbl2">' + (rec.done ? "신청 완료" : "신청 완료로 표시") + "</span>" +
            (f.tel ? '<span class="tiny muted" style="margin-left:auto">☎ ' + f.tel + "</span>" : "") + "</div>" +
            '<div class="inline"><input class="in" data-memo="fund:' + f.id + '" value="' + esc(rec.memo || "") + '" placeholder="메모 (신청일·문의·준비물)"></div>' +
            "</div>";
        });
      });
      return '<div class="wrap">' + h + "</div>";
    }

    /* 출산박스 */
    var bd = BOXES.filter(function (x) { return S.boxes[x.id] && S.boxes[x.id].done; }).length;
    var out = seg + '<p class="note">신청 시기·재고에 따라 달라질 수 있어요. 브랜드 공식 안내를 꼭 확인하세요. (' + bd + "/" + BOXES.length + " 신청함)</p>";
    [["free", "100% 지급형", "신청만 하면 받아요 · 배송비가 들 수 있어요"],
     ["first", "선착순형", "매월 1일 등 정해진 시각에 열려요"]].forEach(function (grp) {
      var list = BOXES.filter(function (x) { return x.type === grp[0]; });
      out += '<div class="grp"><b>' + grp[1] + "</b><span>" + list.length + "개</span></div>" +
        '<div class="tiny muted" style="margin:0 2px 4px">' + grp[2] + "</div>";
      list.forEach(function (x) {
        var rec = S.boxes[x.id] || {};
        out += '<div class="item ' + (rec.done ? "done" : "") + '">' +
          '<div class="hd"><div class="tt">' + x.t + '<div class="amt">' + x.cost + "</div></div>" +
          (x.hot ? '<span class="badge b-hot">마감 임박</span>' : "") +
          (rec.done ? '<span class="badge b-ok">완료</span>' : "") + "</div>" +
          '<div class="kv"><b>시기</b><span>' + x.when + "</span></div>" +
          '<div class="kv"><b>신청</b><span>' + x.where + "</span></div>" +
          '<div class="kv"><b>구성</b><span>' + x.get + "</span></div>" +
          (x.note ? '<div class="tip">🎁 ' + x.note + "</div>" : "") +
          '<div class="cbrow"><button class="cb ' + (rec.done ? "on" : "") + '" data-act="box" data-id="' + x.id + '">' + (rec.done ? "✓" : "") + "</button>" +
          '<span class="lbl2">' + (rec.done ? "신청함" : "신청함으로 표시") + "</span></div>" +
          '<div class="inline"><input class="in" data-memo="box:' + x.id + '" value="' + esc(rec.memo || "") + '" placeholder="메모 (신청일·받은 것)"></div>' +
          "</div>";
      });
    });
    return '<div class="wrap">' + out + "</div>";
  }

  /* ═══════════ 검진 ═══════════ */
  function renderCheck(st) {
    var done = CHECKUPS.filter(function (c) { return S.checks[c.id] && S.checks[c.id].done; }).length;
    var p = Math.round((done / CHECKUPS.length) * 100);
    var h = '<div class="wrap"><div class="seg">' +
      [["all", "전체"], ["early", "초기"], ["mid", "중기"], ["late", "후기"]].map(function (x) {
        return '<button data-act="ckFilter" data-v="' + x[0] + '" class="' + (U.checkFilter === x[0] ? "on" : "") + '">' + x[1] + "</button>";
      }).join("") + "</div>" +
      '<div class="card" style="margin-top:10px"><div class="prow" style="margin:0"><span class="pn">검진 완료</span><span class="pb"><i style="width:' + p + '%"></i></span><span class="pc">' + done + "/" + CHECKUPS.length + "</span></div></div>";

    var groups = [["early", "임신 초기", "4~13주"], ["mid", "임신 중기", "14~27주"], ["late", "임신 후기", "28~40주"]];
    groups.forEach(function (g) {
      if (U.checkFilter !== "all" && U.checkFilter !== g[0]) return;
      var list = CHECKUPS.filter(function (c) { return c.grp === g[0]; });
      if (!list.length) return;
      h += '<div class="grp"><b>' + g[1] + "</b><span>" + g[2] + "</span></div>";
      list.forEach(function (c) {
        var rec = S.checks[c.id] || {}, r = wrange(c.when);
        var now = st.w >= r[0] && st.w <= r[1] + 0;
        var bd = rec.done ? ["b-ok", "완료"] : now ? ["b-hot", "지금"] : st.w > r[1] ? ["b-gray", "시기 지남"] : ["b-info", r[0] + "주~"];
        h += '<div class="item ' + (rec.done ? "done" : "") + '" style="margin:8px 0">' +
          '<div class="hd"><div class="tt">' + c.name + '<div class="when">' + c.when + "</div></div>" +
          '<span class="badge ' + bd[0] + '">' + bd[1] + "</span></div>" +
          '<div class="why">' + c.why + "</div>" +
          '<div class="prep">준비 · ' + c.prep + "</div>" +
          (c.gc ? '<div class="tip">🏛 금천구 · ' + c.gc + "</div>" : "") +
          '<div class="cbrow"><button class="cb ' + (rec.done ? "on" : "") + '" data-act="check" data-id="' + c.id + '">' + (rec.done ? "✓" : "") + "</button>" +
          '<span class="lbl2">' + (rec.done ? "받았어요" : "완료로 표시") + "</span></div>" +
          '<div class="inline" style="margin-top:9px"><span class="tiny muted" style="flex:0 0 auto">예약일</span><input type="date" class="in dt" data-date="check:' + c.id + '" value="' + esc(rec.date || "") + '"></div>' +
          '<div class="inline"><input class="in" data-memo="check:' + c.id + '" value="' + esc(rec.memo || "") + '" placeholder="병원·예약시간·결과 메모"></div>' +
          "</div>";
      });
    });
    return h + '<p class="note">검진 항목과 시기는 병원·산모 상태에 따라 달라져요. 담당 의사 안내를 우선하세요.</p></div>';
  }

  /* ═══════════ 음식 · 준비물 ═══════════ */
  var CATS = [["all", "전체"], ["sea", "해산물·회"], ["drink", "카페인·음료"], ["dairy", "유제품·치즈"], ["meat", "육류·가공육"], ["veg", "과일·채소"], ["supp", "영양제·약"], ["life", "생활·기타"]];
  var CATN = {}; CATS.forEach(function (c) { CATN[c[0]] = c[1]; });
  var SMAP = { good: ["good", "b-ok", "먹어도 돼요"], caution: ["caution", "b-warn", "조심해요"], avoid: ["avoid", "b-bad", "피하세요"] };

  function foodRows() {
    var q = U.foodQ.trim().toLowerCase();
    return FOODIS.filter(function (f) {
      if (U.foodCat !== "all" && f.c !== U.foodCat) return false;
      if (!q) return true;
      return (f.n + " " + f.r).toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) {
      var o = { avoid: 0, caution: 1, good: 2 };
      return o[a.s] - o[b.s];
    });
  }
  function foodListHTML() {
    var rows = foodRows();
    if (!rows.length) return '<div class="empty">검색 결과가 없어요.<br>다른 단어로 찾아보세요.</div>';
    var n = { good: 0, caution: 0, avoid: 0 };
    rows.forEach(function (f) { n[f.s]++; });
    var head = '<div class="tiny muted" style="margin:2px 2px 0">' + rows.length + "개 · 피하세요 " + n.avoid + " · 조심해요 " + n.caution + " · 먹어도 돼요 " + n.good + "</div>";
    return head + rows.map(function (f) {
      var s = SMAP[f.s];
      return '<div class="food ' + s[0] + '">' +
        '<div class="top"><span class="nm">' + f.n + '</span><span class="badge ' + s[1] + '">' + s[2] + "</span></div>" +
        '<div class="rs">' + f.r + '</div><div class="ct">' + CATN[f.c] + "</div></div>";
    }).join("");
  }

  function bagRows() {
    var rows = BAG.map(function (b, i) { return { id: "b" + i, c: b.c, t: b.t }; });
    S.bagCustom.forEach(function (x) { rows.push({ id: x.id, c: x.c, t: x.t, custom: true }); });
    return rows;
  }

  function renderFood(st) {
    var seg = '<div class="seg">' +
      '<button data-act="foodSeg" data-v="food" class="' + (U.foodSeg === "food" ? "on" : "") + '">음식 검색</button>' +
      '<button data-act="foodSeg" data-v="bag" class="' + (U.foodSeg === "bag" ? "on" : "") + '">출산가방</button>' +
      "</div>";

    if (U.foodSeg === "food") {
      return '<div class="wrap">' + seg +
        '<div class="searchbox"><span class="ic">🔍</span><input id="fq" class="in" type="search" placeholder="음식 이름으로 찾기 (예: 연어, 커피)" value="' + esc(U.foodQ) + '"></div>' +
        '<div class="chips">' + CATS.map(function (c) {
          return '<button class="chip ' + (U.foodCat === c[0] ? "on" : "") + '" data-act="fcat" data-v="' + c[0] + '">' + c[1] + "</button>";
        }).join("") + "</div>" +
        '<div id="foodList">' + foodListHTML() + "</div>" +
        '<p class="note">같은 음식도 조리 상태·개인 건강 상태에 따라 달라요. 조리 전 위생과 완전 익힘이 가장 중요하고, 판단이 어려우면 담당 의사에게 물어보세요.</p>' +
        "</div>";
    }

    var rows = bagRows();
    var total = rows.length, done = rows.filter(function (r) { return S.bag[r.id]; }).length;
    var h = seg + '<p class="note">체크 상태는 자동으로 저장돼요. (' + done + "/" + total + ")</p>";
    ["mom", "baby", "bag"].forEach(function (c) {
      var list = rows.filter(function (r) { return r.c === c; });
      var d = list.filter(function (r) { return S.bag[r.id]; }).length;
      var p = list.length ? Math.round((d / list.length) * 100) : 0;
      h += '<div class="card" style="margin:12px 0 6px"><h2><span class="em">' + (c === "mom" ? "🤰" : c === "baby" ? "👶" : "🧳") + "</span> " + BAGCAT[c] + "</h2>" +
        '<div class="prow" style="margin:4px 0 0"><span class="pb"><i style="width:' + p + '%"></i></span><span class="pc">' + d + "/" + list.length + "</span></div></div>";
      h += '<div class="bagwrap">' + list.map(function (r) {
        return '<div class="bgit ' + (S.bag[r.id] ? "on" : "") + '">' +
          '<button class="cb ' + (S.bag[r.id] ? "on" : "") + '" data-act="bag" data-id="' + r.id + '">' + (S.bag[r.id] ? "✓" : "") + "</button>" +
          '<span class="tx">' + esc(r.t) + "</span>" +
          (r.custom ? '<button class="del" data-act="delBag" data-id="' + r.id + '">✕</button>' : "") + "</div>";
      }).join("") + "</div>";
      if (c === "bag") {
        h += '<div class="bagwrap" style="padding:12px 13px"><div class="bagadd" style="margin:0"><select id="bagCat"><option value="mom">산모</option><option value="baby">아기</option><option value="bag">가방</option></select>' +
          '<input id="bagNew" class="in" placeholder="직접 추가할 준비물"><button data-act="addBag">추가</button></div></div>';
      }
    });
    return '<div class="wrap">' + h + "</div>";
  }

  /* ═══════════ 렌더 ═══════════ */
  function render(keep) {
    var y = window.scrollY;
    var st = calc();
    document.getElementById("wkchip").textContent = st.w + "주 " + st.d + "일";
    var v = document.getElementById("view");
    if (U.tab === "home") v.innerHTML = renderHome(st);
    else if (U.tab === "fund") v.innerHTML = renderFund(st);
    else if (U.tab === "check") v.innerHTML = renderCheck(st);
    else v.innerHTML = renderFood(st);
    [].forEach.call(document.querySelectorAll("#tabs .tb"), function (b) {
      b.className = "tb" + (b.dataset.tab === U.tab ? " on" : "");
    });
    if (keep) window.scrollTo(0, y); else window.scrollTo(0, 0);
    if (U.tab === "home") {
      var el = document.querySelector(".strip button.sel") || document.querySelector(".strip button.cur");
      if (el) {
        var strip = el.parentNode;
        strip.scrollLeft = el.offsetLeft - strip.clientWidth / 2 + el.offsetWidth / 2;
      }
    }
  }

  /* ═══════════ 이벤트 ═══════════ */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.dataset.act, id = t.dataset.id, r;

    if (act === "tab" || act === "go") { U.tab = t.dataset.tab; U.viewW = null; render(); return; }
    if (act === "wk") { var w = +t.dataset.w; if (w >= 4 && w <= 40) { U.viewW = w; render(); } return; }
    if (act === "wkNow") { U.viewW = null; render(); return; }
    if (act === "fundSeg") { U.fundSeg = t.dataset.v; render(); return; }
    if (act === "foodSeg") { U.foodSeg = t.dataset.v; render(); return; }
    if (act === "ckFilter") { U.checkFilter = t.dataset.v; render(); return; }
    if (act === "fcat") { U.foodCat = t.dataset.v; render(); return; }
    if (act === "more") {
      var ds = document.getElementById("ds_" + id);
      if (ds) {
        var open = ds.classList.toggle("clamp");
        t.textContent = open ? "더 보기 ▾" : "접기 ▴";
      }
      return;
    }

    if (act === "fund") { r = get(id, "fund"); r.done = !r.done; save(); render(true); return; }
    if (act === "box") { r = get(id, "box"); r.done = !r.done; save(); render(true); return; }
    if (act === "check") { r = get(id, "check"); r.done = !r.done; save(); render(true); return; }
    if (act === "bag") { S.bag[id] = !S.bag[id]; save(); render(true); return; }
    if (act === "delBag") {
      S.bagCustom = S.bagCustom.filter(function (x) { return x.id !== id; });
      delete S.bag[id]; save(); render(true); return;
    }
    if (act === "addBag") {
      var inp = document.getElementById("bagNew"), sel = document.getElementById("bagCat");
      var v2 = (inp && inp.value || "").trim();
      if (!v2) { if (inp) inp.focus(); return; }
      S.bagCustom.push({ id: "c" + Date.now(), c: sel ? sel.value : "mom", t: v2 });
      save(); render(true); return;
    }
    if (act === "openSet") { openSet(); return; }
    if (act === "closeSet") { document.getElementById("modal").classList.add("hide"); return; }
    if (act === "saveDue") {
      var dv = document.getElementById("setDue").value;
      if (dv) { S.lmp = iso(addDays(pd(dv), -280)); save(); document.getElementById("modal").classList.add("hide"); render(); }
      return;
    }
    if (act === "saveWeek") {
      var sw = Math.max(0, Math.min(42, +document.getElementById("setW").value || 0));
      var sd = Math.max(0, Math.min(6, +document.getElementById("setD").value || 0));
      S.lmp = iso(addDays(today(), -(sw * 7 + sd))); save();
      document.getElementById("modal").classList.add("hide"); render(); return;
    }
    if (act === "resetSet") {
      S.lmp = DEFAULT_LMP; save(); document.getElementById("modal").classList.add("hide"); render(); return;
    }
  });

  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "fq") {
      U.foodQ = el.value;
      var list = document.getElementById("foodList");
      if (list) list.innerHTML = foodListHTML();
      return;
    }
    var m = el.dataset.memo, d = el.dataset.date;
    if (m) {
      var p = m.split(":"), rec = get(p[1], p[0]);
      rec.memo = el.value; save();
    } else if (d) {
      var q = d.split(":"), rec2 = get(q[1], q[0]);
      rec2.date = el.value; save();
    }
  });

  var modal = document.getElementById("modal");
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.classList.add("hide"); });

  function openSet() {
    var st = calc();
    document.getElementById("setDue").value = iso(st.due);
    document.getElementById("setW").value = st.w;
    document.getElementById("setD").value = st.d;
    document.getElementById("setInfo").textContent = "지금 설정: " + st.w + "주 " + st.d + "일 · 예정일 " + fmtKo(st.due);
    modal.classList.remove("hide");
  }

  /* 시작 */
  render();
})();
</script>
</body>
</html>
